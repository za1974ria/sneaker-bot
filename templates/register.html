<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SneakerBot — Inscription</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
        }
        h1 { color: #00ff88; text-align: center; margin-bottom: 8px; font-size: 24px; }
        p.sub { text-align: center; color: #666; font-size: 13px; margin-bottom: 24px; }
        label { display: block; color: #aaa; font-size: 13px; margin-bottom: 4px; }
        input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .error {
            background: #ff444422;
            border: 1px solid #ff4444;
            color: #ff6666;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Créer un compte</h1>
        <p class="sub">Inscription client SneakerBot</p>
        {% if error %}
        <div class="error">❌ {{ error }}</div>
        {% endif %}
        <form method="POST" action="/register">
            <label>Identifiant</label>
            <input type="text" name="username" minlength="4" required>
            <label>Mot de passe</label>
            <input type="password" name="password" minlength="6" required>
            <button type="submit">S'inscrire</button>
        </form>
        <p style="text-align:center;margin-top:12px;font-size:12px;color:#444">
            Déjà un compte ? <a href="/login" style="color:#00ff88">Se connecter</a>
        </p>
    </div>
</body>
</html>
